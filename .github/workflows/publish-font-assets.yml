name: Publish font assets

on:
  push:
    tags:
      - font-assets-*

permissions:
  contents: write

jobs:
  publish-assets:
    name: Publish font archives
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out asset tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check asset tag
        run: |
          node -e '
            const source = require("./font-source.json");
            const expectedTag = `font-assets-${source.version}`;
            if (process.env.GITHUB_REF_NAME !== expectedTag) {
              console.error(`Asset tag ${process.env.GITHUB_REF_NAME} does not match font version ${source.version}. Expected ${expectedTag}.`);
              process.exit(1);
            }
          '

      - name: Build font archives
        run: pnpm run build:assets

      - name: Check asset manifest
        run: git diff --exit-code -- font-assets.json

      - name: Create asset release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/font-assets/*.tar.gz \
            dist/font-assets/font-assets.json \
            --title "Sarasa UI SC font assets ${GITHUB_REF_NAME#font-assets-}" \
            --notes "Build-time font archives for sarasa-gothic-webfont. Each archive includes one weight, Unicode-range CSS, WOFF2 files, and the SIL Open Font License 1.1."
        env:
          GH_TOKEN: ${{ github.token }}
